<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07150e">
<title>NOVA FOOTBALL ONLINE V7 FINAL</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07150e;color:white;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block}
.panel{position:fixed;z-index:5;background:#07150ff2;border:1px solid #ffffff28;border-radius:18px;padding:18px;box-shadow:0 12px 45px #0009}
#menu{width:min(92%,390px);left:50%;top:50%;transform:translate(-50%,-50%);text-align:center}
.logo{font-size:29px;font-weight:1000;letter-spacing:2px;color:#70ffa0}
.sub{font-size:12px;color:#a9c6b4;margin:9px 0 18px}
button{border:0;border-radius:11px;padding:13px;background:#70ffa0;color:#07150e;font-weight:900;width:100%;margin:5px 0}
.secondary{background:#203d2d;color:white;border:1px solid #ffffff28}
button:disabled{opacity:.5}
input,select{width:100%;padding:13px;background:#10271b;color:white;border:1px solid #ffffff35;border-radius:10px;margin:5px 0}
#top{position:fixed;z-index:3;top:10px;left:10px;right:10px;display:none;justify-content:space-between;gap:5px;pointer-events:none}
.info{background:#06140eeb;border:1px solid #ffffff25;border-radius:10px;padding:9px;font-size:12px}
#score{font-size:23px;font-weight:1000;color:#80ffa6}
#settingsBtn{position:fixed;z-index:8;right:10px;top:10px;width:auto;background:#142b1d;color:white}
#settings{display:none;right:10px;top:58px;width:min(270px,90vw)}
#controls{display:none;position:fixed;z-index:4;inset:auto 0 15px}
#stickBase{position:absolute;left:20px;bottom:5px;width:120px;height:120px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff55;touch-action:none}
#stick{position:absolute;left:34px;top:34px;width:48px;height:48px;border-radius:50%;background:#80ffa6}
.actions{position:absolute;right:17px;bottom:9px;display:flex;gap:10px}
.actions button{width:72px;height:72px;border-radius:50%;margin:0}
#status{position:fixed;z-index:7;bottom:5px;left:50%;transform:translateX(-50%);background:#06140eeb;padding:8px 12px;border-radius:9px;font-size:12px;white-space:nowrap;max-width:95%;overflow:hidden}
#result{display:none;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90%,350px);text-align:center}
#result h1{color:#80ffa6}
#roomInfo{color:#a5ffbd;font-weight:bold;margin:12px}
#rotate{display:none;position:fixed;z-index:20;inset:0;background:#07150e;align-items:center;justify-content:center;text-align:center;padding:25px}
#exitBtn{position:fixed;z-index:4;left:10px;top:60px;width:auto;display:none;background:#263d31;color:white}
</style>
</head>
<body>
<div id="game"></div>
<div id="rotate">📱<br><br>En iyi deneyim için cihazını yatay çevir.</div>

<div id="top">
 <div class="info">NOVA V7 FINAL<br><span id="connection">Bağlı</span></div>
 <div class="info" id="score">0 - 0</div>
 <div class="info">SÜRE<br><span id="timer">03:00</span></div>
 <div class="info">FPS <span id="fps">--</span></div>
</div>

<button id="settingsBtn">⚙ Grafik</button>
<div id="settings" class="panel">
 <b>GRAFİK AYARLARI</b>
 <select id="quality">
  <option value="auto">Otomatik</option>
  <option value="lite">Lite</option>
  <option value="balanced">Dengeli</option>
  <option value="high">Yüksek</option>
  <option value="ultra">Ultra</option>
 </select>
 <p id="qinfo" class="sub"></p>
 <button class="secondary" id="closeSettings">Kapat</button>
</div>

<div id="menu" class="panel">
 <div class="logo">NOVA FOOTBALL</div>
 <div class="sub">ONLINE FOOTBALL EXPERIENCE · V7 FINAL</div>
 <button id="quick">⚡ HIZLI EŞLEŞME</button>
 <button id="create" class="secondary">＋ ODA OLUŞTUR</button>
 <input id="roomCode" maxlength="6" inputmode="numeric" placeholder="6 HANELİ ODA KODU">
 <button id="join" class="secondary">ODA KODUYLA KATIL</button>
 <div id="roomInfo" class="sub"></div>
 <button id="ready" style="display:none">MAÇA HAZIRIM ⚽</button>
</div>

<button id="exitBtn">← ODAYI TERK ET</button>

<div id="result" class="panel">
 <h1>MAÇ TAMAMLANDI!</h1>
 <div id="finalScore" style="font-size:32px;font-weight:1000">0 - 0</div>
 <p id="winner"></p>
 <button id="rematch">🔁 RÖVANŞ İSTE</button>
 <button id="back" class="secondary">ANA MENÜ</button>
</div>

<div id="controls">
 <div id="stickBase"><div id="stick"></div></div>
 <div class="actions">
  <button class="secondary" id="press">PRES</button>
  <button id="shoot">ŞUT ⚽</button>
 </div>
</div>
<div id="status">NOVA V7 hazırlanıyor...</div>

<script src="/socket.io/socket.io.js"></script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const $=id=>document.getElementById(id);
const socket=io();
let scene,camera,renderer,ball,players=[];
let started=false,finished=false,roomCode='';
let move={x:0,z:0},lastFrame=0,frames=0,fpsTime=performance.now();
let quality='lite',scale=1,roomJoined=false;
const profiles={
 lite:{scale:.72,fps:30,crowd:false},
 balanced:{scale:.9,fps:40,crowd:false},
 high:{scale:1.1,fps:60,crowd:true},
 ultra:{scale:1.35,fps:60,crowd:true}
};
function say(t){$('status').textContent=t}
function autoQuality(){
 const ram=navigator.deviceMemory||2;
 const cores=navigator.hardwareConcurrency||4;
 return ram<=2||cores<=4?'lite':ram<=4?'balanced':'high';
}
function applyQuality(){
 const selected=$('quality').value;
 quality=selected==='auto'?autoQuality():selected;
 if(renderer)renderer.setPixelRatio(Math.min(devicePixelRatio||1,profiles[quality].scale)*scale);
 $('qinfo').textContent=quality.toUpperCase()+' · '+profiles[quality].fps+' FPS hedefi';
 localStorage.setItem('novaV7Quality',selected);
}
$('quality').value=localStorage.getItem('novaV7Quality')||'auto';
$('settingsBtn').onclick=()=>$('settings').style.display=$('settings').style.display==='block'?'none':'block';
$('closeSettings').onclick=()=>$('settings').style.display='none';
$('quality').onchange=applyQuality;

function box(w,h,d,color,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color}));
 m.position.set(x,y,z);scene.add(m);return m;
}
function player(color){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.32,.55,3,6),new THREE.MeshLambertMaterial({color}));
 body.position.y=.7;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.2,8,6),new THREE.MeshLambertMaterial({color:0xffd2ad}));
 head.position.y=1.3;g.add(head);
 scene.add(g);return g;
}
function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x8ab2c0);
 camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,110);
 camera.position.set(0,24,26);camera.lookAt(0,0,0);
 renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});
 renderer.shadowMap.enabled=false;
 $('game').appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xffffff,0x42634a,2));
 const sun=new THREE.DirectionalLight(0xffffff,1);sun.position.set(-8,18,10);scene.add(sun);
 box(100,.2,70,0x285b35,0,-.3,0);
 const grass=new THREE.Mesh(new THREE.PlaneGeometry(40,20),new THREE.MeshLambertMaterial({color:0x258a42}));
 grass.rotation.x=-Math.PI/2;grass.position.y=-.15;scene.add(grass);
 for(let i=0;i<10;i++){
  const stripe=new THREE.Mesh(new THREE.PlaneGeometry(4,20),new THREE.MeshBasicMaterial({color:i%2?0x278b43:0x237e3c}));
  stripe.rotation.x=-Math.PI/2;stripe.position.set(-18+i*4,-.14,0);scene.add(stripe);
 }
 const white=0xffffff;
 box(40,.025,.035,white,0,0,-10);box(40,.025,.035,white,0,0,10);
 box(.035,.025,20,white,-20,0,0);box(.035,.025,20,white,20,0,0);
 box(.035,.025,20,white,0,0,0);
 for(const x of [-20,20]){
  box(.2,2.3,7,white,x,1.15,0);
  box(2.5,.2,.2,white,x+(x<0?1.25:-1.25),2.3,0);
 }
 for(const z of [-14,14])for(let i=0;i<3;i++)box(42,1,2,0x344d60,0,1+i*1.1,z);
 if(profiles[quality].crowd){
  const crowd=new THREE.InstancedMesh(
   new THREE.BoxGeometry(.16,.22,.15),
   new THREE.MeshBasicMaterial({color:0xd9e3df}),160
  );
  const d=new THREE.Object3D();
  for(let i=0;i<160;i++){
   d.position.set((Math.random()-.5)*40,2+(i%4)*.25,i%2?15:-15);
   d.updateMatrix();crowd.setMatrixAt(i,d.matrix);
  }
  scene.add(crowd);
 }
 players=[player(0x2196ff),player(0xff5555)];
 ball=new THREE.Mesh(new THREE.SphereGeometry(.32,10,8),new THREE.MeshLambertMaterial({color:0xffffff}));
 ball.position.y=.35;scene.add(ball);
 applyQuality();resize();
}
function resize(){
 if(!renderer)return;
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight,false);
}
function formatTime(v){
 const t=Math.max(0,Math.ceil(v));
 return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
}
function update(data){
 if(!data)return;
 $('score').textContent=(data.score?.[0]||0)+' - '+(data.score?.[1]||0);
 $('timer').textContent=formatTime(data.remaining??180);
 (data.players||[]).forEach((p,i)=>{
  if(players[i])players[i].position.set(p.x||0,0,p.z||0);
 });
 if(data.ball)ball.position.set(data.ball.x||0,.35,data.ball.z||0);

 started=!!data.started;
 finished=!!data.finished;

 if(started){
  $('menu').style.display='none';
  $('result').style.display='none';
  $('controls').style.display='block';
  $('top').style.display='flex';
  $('exitBtn').style.display='block';
 }else{
  $('controls').style.display='none';
  if(finished){
   $('menu').style.display='none';
   $('result').style.display='block';
   $('top').style.display='flex';
   $('exitBtn').style.display='none';
   $('finalScore').textContent=(data.score?.[0]||0)+' - '+(data.score?.[1]||0);
   $('winner').textContent=data.winner||'Maç tamamlandı.';
  }else{
   $('top').style.display='none';
   $('result').style.display='none';
   if(roomJoined)$('menu').style.display='block';
  }
 }
}
function loop(now){
 requestAnimationFrame(loop);
 if(!renderer)return;
 if(now-lastFrame<1000/profiles[quality].fps)return;
 lastFrame=now;
 renderer.render(scene,camera);
 frames++;
 if(now-fpsTime>=1000){
  const f=Math.round(frames*1000/(now-fpsTime));
  $('fps').textContent=f;
  frames=0;fpsTime=now;
  if($('quality').value==='auto'&&f<22&&scale>.65){
   scale=Math.max(.65,scale-.1);applyQuality();
  }
 }
 if(started){
  camera.position.x+=(players[0].position.x-camera.position.x)*.025;
  camera.position.z+=(players[0].position.z+24-camera.position.z)*.025;
  camera.lookAt(players[0].position.x,0,players[0].position.z);
 }
}
try{init();requestAnimationFrame(loop)}
catch(e){say('Grafik başlatılamadı: '+e.message)}
window.addEventListener('resize',resize);

function landscape(){
 document.documentElement.requestFullscreen?.().catch(()=>{});
 screen.orientation?.lock?.('landscape').catch(()=>{});
}
function showRoom(info){
 roomJoined=true;
 roomCode=info?.code||info?.roomCode||'';
 $('roomInfo').textContent=roomCode?'ODA KODUN: '+roomCode:'Odaya katıldın.';
 $('ready').style.display='block';
 $('ready').disabled=false;
 $('menu').style.display='block';
 $('result').style.display='none';
 say('Oda hazır. Arkadaşını bekle veya maça hazırlan.');
}
socket.on('connect',()=>{
 $('connection').textContent='Bağlı';
 say('Sunucu bağlantısı başarılı.');
});
socket.on('disconnect',()=>{
 $('connection').textContent='Bağlantı kesildi';
 say('Sunucu bağlantısı kesildi.');
});
socket.on('joined',showRoom);
socket.on('roomJoined',showRoom);
socket.on('state',update);
socket.on('notice',say);
socket.on('errorMessage',m=>{
 $('quick').disabled=false;
 $('ready').disabled=false;
 say(m);
});
socket.on('matchFound',()=>say('Rakip bulundu! İkiniz de hazır olun.'));

$('create').onclick=()=>{
 landscape();say('Oda oluşturuluyor...');
 socket.emit('createRoom');
};
$('join').onclick=()=>{
 landscape();
 const c=$('roomCode').value.trim();
 if(!/^\d{6}$/.test(c))return say('6 haneli oda kodu gir.');
 say('Odaya katılınıyor...');
 socket.emit('joinRoom',c);
};
$('quick').onclick=()=>{
 landscape();
 $('quick').disabled=true;
 say('Rakip aranıyor...');
 socket.emit('quickPlay');
};
$('ready').onclick=()=>{
 socket.emit('ready');
 $('ready').disabled=true;
 say('Hazır durumundasın. Rakip bekleniyor...');
};
$('rematch').onclick=()=>{
 $('rematch').disabled=true;
 socket.emit('rematch');
 say('Rövanş isteği gönderildi. Rakibin bekleniyor.');
};
$('back').onclick=()=>{
 socket.emit('leaveRoom');
 roomJoined=false;
 finished=false;started=false;
 $('result').style.display='none';
 $('menu').style.display='block';
 $('top').style.display='none';
 $('roomInfo').textContent='';
 $('ready').style.display='none';
 $('ready').disabled=false;
 $('rematch').disabled=false;
 say('Ana menü.');
};
$('shoot').onclick=()=>{if(started)socket.emit('action','shoot')};
$('press').onclick=()=>{if(started)socket.emit('action','press')};
$('exitBtn').onclick=()=>{
 socket.emit('leaveRoom');
 roomJoined=false;started=false;finished=false;
 $('controls').style.display='none';
 $('top').style.display='none';
 $('exitBtn').style.display='none';
 $('menu').style.display='block';
 $('result').style.display='none';
 $('ready').style.display='none';
 say('Odadan ayrıldın.');
};

const base=$('stickBase'),knob=$('stick');
let pointer=null;
function moveStick(e){
 const r=base.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 const n=Math.hypot(x,y),max=38;
 if(n>max){x=x/n*max;y=y/n*max;}
 knob.style.transform=`translate(${x}px,${y}px)`;
 move={x:x/max,z:y/max};
}
function reset(){
 pointer=null;move={x:0,z:0};
 knob.style.transform='translate(0,0)';
}
base.addEventListener('pointerdown',e=>{
 pointer=e.pointerId;base.setPointerCapture(pointer);moveStick(e);
});
base.addEventListener('pointermove',e=>{if(pointer===e.pointerId)moveStick(e)});
base.addEventListener('pointerup',reset);
base.addEventListener('pointercancel',reset);
base.addEventListener('lostpointercapture',reset);
setInterval(()=>{if(started)socket.emit('input',move)},50);
$('rotate').style.display=innerHeight>innerWidth?'flex':'none';
window.addEventListener('resize',()=>$('rotate').style.display=innerHeight>innerWidth?'flex':'none');
</script>
</body>
</html>
