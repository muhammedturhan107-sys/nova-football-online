<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07101d">
<title>NOVA FOOTBALL ONLINE V3</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:white;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0;display:block}
#menu{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#183a50,#07101d 70%);padding:18px}
.panel{width:min(440px,100%);padding:25px;border:1px solid #ffffff22;border-radius:25px;background:#071522ed;box-shadow:0 20px 70px #0009;text-align:center}
.logo{font-size:36px;font-weight:1000;letter-spacing:3px;color:#50e5ad}
.sub{color:#a9bdca;margin:8px 0 22px}
button{border:0;border-radius:14px;padding:15px 18px;font-weight:900;font-size:15px;color:#06131a;background:#50e5ad;cursor:pointer}
button:active{transform:scale(.97)}
.main{width:100%;margin:7px 0}
.secondary{background:#20394a;color:white}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff33;background:#0b1c2b;color:white;text-align:center;font-size:18px;margin:7px 0}
#message{min-height:24px;color:#f5d889;font-size:13px;margin-top:10px}
#hud{display:none;position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:2;background:#06131ddd;border:1px solid #ffffff22;border-radius:15px;padding:9px 20px;text-align:center;min-width:180px}
#score{font-size:25px;font-weight:1000;letter-spacing:4px}
#roomLabel{font-size:11px;color:#9db4c3}
#controls{display:none;position:fixed;inset:0;z-index:3;pointer-events:none}
#stickBase{position:absolute;left:24px;bottom:25px;width:125px;height:125px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff55;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:37px;top:37px;width:47px;height:47px;border-radius:50%;background:#50e5ad;border:3px solid white;box-shadow:0 4px 15px #0008}
.action{position:absolute;right:25px;bottom:35px;width:85px;height:85px;border-radius:50%;pointer-events:auto;touch-action:none;display:none;background:#50e5ad;color:#07101d;border:3px solid #ffffffaa}
#press{right:120px;bottom:55px;width:65px;height:65px;background:#ffc65b}
#hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;color:#d5e4ec;background:#06131dbb;padding:6px 10px;border-radius:10px;white-space:nowrap}
#notice{position:fixed;z-index:4;top:70px;left:50%;transform:translateX(-50%);padding:9px 15px;background:#06131ddd;border-radius:12px;color:#50e5ad;font-weight:bold;display:none}
@media(orientation:portrait){#rotate{display:block}}
#rotate{display:none;position:fixed;z-index:10;inset:0;background:#07101d;color:white;text-align:center;padding:25vh 20px;font-weight:bold}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="menu">
  <div class="panel">
    <div class="logo">NOVA</div>
    <div style="font-size:19px;font-weight:900">FOOTBALL ONLINE</div>
    <div class="sub">V3 • GERÇEK ZAMANLI 1v1 FUTBOL</div>
    <button class="main" id="start">⚽ HIZLI EŞLEŞ VE OYNA</button>
    <button class="main secondary" id="create">＋ ODA OLUŞTUR</button>
    <input id="roomCode" maxlength="6" inputmode="numeric" placeholder="6 HANELİ ODA KODU">
    <button class="main secondary" id="join">ODA KODUYLA KATIL</button>
    <div id="message">Oyuna başlamak için bir seçenek seç.</div>
  </div>
</div>

<div id="hud">
  <div id="score">0 - 0</div>
  <div id="roomLabel">ODA: ------ • RAKİP BEKLENİYOR</div>
</div>
<div id="notice"></div>
<div id="controls">
  <div id="stickBase"><div id="stick"></div></div>
  <button class="action" id="shoot">ŞUT</button>
  <button class="action" id="press">PRES</button>
  <div id="hint">JOYSTICK: HAREKET</div>
</div>
<div id="rotate">📱 Telefonunu yatay konuma çevir.</div>

<script src="/socket.io/socket.io.js"></script>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

const socket = io();
const $ = id => document.getElementById(id);
let roomId = "", myId = "", myTeam = 0, gameStarted = false, latest = null;
let joy = {x:0,z:0}, keys = {};
let scene, camera, renderer, ball, players = [], field;
const menu = $("menu"), controls = $("controls"), hud = $("hud");

function message(t){ $("message").textContent=t; }
function notice(t){
  $("notice").textContent=t;
  $("notice").style.display="block";
  clearTimeout(notice.timer);
  notice.timer=setTimeout(()=>$("notice").style.display="none",2200);
}

async function fullscreenLandscape(){
  try{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
  }catch(e){}
  try{
    if(screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape");
  }catch(e){}
}

function enterGame(mode, codeValue){
  fullscreenLandscape();
  message("Sunucuya bağlanılıyor...");
  $("start").disabled=true;
  $("create").disabled=true;
  $("join").disabled=true;

  const send = () => {
    if(mode==="quick") socket.emit("quickPlay");
    if(mode==="create") socket.emit("createRoom");
    if(mode==="join") socket.emit("joinRoom",codeValue);
  };
  if(socket.connected) send();
  else socket.once("connect",send);
}

$("start").onclick=()=>enterGame("quick");
$("create").onclick=()=>enterGame("create");
$("join").onclick=()=>{
  const c=$("roomCode").value.trim();
  if(c.length!==6){message("6 haneli oda kodunu gir.");return;}
  enterGame("join",c);
};

socket.on("connect",()=>{myId=socket.id;});
socket.on("connect_error",()=>message("Sunucuya bağlanılamadı. Biraz sonra tekrar dene."));
socket.on("errorMessage",t=>{
  message(t);
  $("start").disabled=false;$("create").disabled=false;$("join").disabled=false;
});
socket.on("joined",data=>{
  roomId=data.room;myTeam=data.team;
  $("roomLabel").textContent="ODA: "+roomId+" • "+(data.waiting?"RAKİP BEKLENİYOR":"RAKİP BULUNDU");
  message("Odaya girdin. Hazırlanıyor...");
  menu.style.display="none";
  hud.style.display="block";
  controls.style.display="block";
  socket.emit("ready");
});
socket.on("notice",notice);
socket.on("state",data=>{
  latest=data;
  $("score").textContent=data.score[0]+" - "+data.score[1];
  const count=data.players.length;
  $("roomLabel").textContent="ODA: "+data.room+" • "+(count<2?"RAKİP BEKLENİYOR":data.started?"MAÇ DEVAM EDİYOR":"İKİ OYUNCU HAZIRLANIYOR");
  gameStarted=data.started;
  if(data.started){
    $("shoot").style.display=data.ball.owner===myId?"block":"none";
    $("press").style.display=data.ball.owner && data.ball.owner!==myId?"block":"none";
  }else{
    $("shoot").style.display="none";$("press").style.display="none";
  }
});

function init3D(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x071522);
  scene.fog=new THREE.Fog(0x071522,35,75);
  camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,150);
  camera.position.set(0,24,27);
  camera.lookAt(0,0,0);

  renderer=new THREE.WebGLRenderer({canvas:$("game"),antialias:true,alpha:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  scene.add(new THREE.HemisphereLight(0xc9edff,0x16351e,2));
  const light=new THREE.DirectionalLight(0xffffff,2.2);
  light.position.set(-8,22,10);light.castShadow=true;scene.add(light);

  const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x102a35}));
  ground.rotation.x=-Math.PI/2;ground.position.y=-.12;scene.add(ground);

  field=new THREE.Group();scene.add(field);
  const grass=new THREE.Mesh(new THREE.PlaneGeometry(40,20),new THREE.MeshStandardMaterial({color:0x16834c,roughness:1}));
  grass.rotation.x=-Math.PI/2;grass.receiveShadow=true;field.add(grass);

  const lineMat=new THREE.MeshBasicMaterial({color:0xffffff});
  function line(x,z,w,h){
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,.025,h),lineMat);
    m.position.set(x,.025,z);field.add(m);
  }
  line(0,0,.055,20);line(0,-10,40,.055);line(0,10,40,.055);
  line(-20,0,.055,20);line(20,0,.055,20);
  const circle=new THREE.Mesh(new THREE.RingGeometry(3.95,4,.06,80),lineMat);
  circle.rotation.x=-Math.PI/2;circle.position.y=.03;field.add(circle);

  for(const x of [-20,20]){
    const goal=new THREE.Mesh(new THREE.BoxGeometry(.35,2.2,6.2),new THREE.MeshStandardMaterial({color:0xe8f2f5,wireframe:true}));
    goal.position.set(x,1,0);field.add(goal);
  }

  const ballGeo=new THREE.SphereGeometry(.42,20,16);
  ball=new THREE.Mesh(ballGeo,new THREE.MeshStandardMaterial({color:0xffffff,roughness:.45}));
  ball.position.y=.43;ball.castShadow=true;scene.add(ball);

  for(let i=0;i<2;i++){
    const group=new THREE.Group();
    const shirt=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.75,5,10),new THREE.MeshStandardMaterial({color:i===0?0x16b9ff:0xff4c59}));
    shirt.position.y=1.05;shirt.castShadow=true;group.add(shirt);
    const head=new THREE.Mesh(new THREE.SphereGeometry(.28,14,12),new THREE.MeshStandardMaterial({color:0xf1c79d}));
    head.position.y=1.85;group.add(head);
    scene.add(group);players.push(group);
  }
  animate();
}
function animate(){
  requestAnimationFrame(animate);
  if(latest){
    latest.players.forEach(p=>{
      const obj=players[p.team];
      if(obj){obj.position.set(p.x,0,p.z);obj.rotation.y=p.team===0?Math.PI/2:-Math.PI/2;}
    });
    ball.position.set(latest.ball.x,.43,latest.ball.z);
  }
  if(renderer)renderer.render(scene,camera);
}
init3D();

addEventListener("resize",()=>{
  if(!camera||!renderer)return;
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

function updateInput(){
  let x=joy.x,z=joy.z;
  if(keys.ArrowLeft||keys.a)x-=1;
  if(keys.ArrowRight||keys.d)x+=1;
  if(keys.ArrowUp||keys.w)z-=1;
  if(keys.ArrowDown||keys.s)z+=1;
  const len=Math.hypot(x,z);
  if(len>1){x/=len;z/=len;}
  if(gameStarted)socket.emit("input",{x,z});
  requestAnimationFrame(updateInput);
}
updateInput();

addEventListener("keydown",e=>{keys[e.key]=true;if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();});
addEventListener("keyup",e=>{keys[e.key]=false;});

const base=$("stickBase"), knob=$("stick");
let pointer=null;
function moveStick(e){
  const r=base.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy;
  const max=43,len=Math.hypot(dx,dy);
  if(len>max){dx=dx/len*max;dy=dy/len*max;}
  knob.style.transform=`translate(${dx}px,${dy}px)`;
  joy.x=dx/max;
  joy.z=dy/max;
}
base.addEventListener("pointerdown",e=>{
  pointer=e.pointerId;base.setPointerCapture(pointer);moveStick(e);
});
base.addEventListener("pointermove",e=>{if(e.pointerId===pointer)moveStick(e);});
function resetStick(){pointer=null;joy={x:0,z:0};knob.style.transform="translate(0,0)";}
base.addEventListener("pointerup",resetStick);
base.addEventListener("pointercancel",resetStick);
base.addEventListener("lostpointercapture",resetStick);

$("shoot").addEventListener("pointerdown",e=>{e.preventDefault();socket.emit("action","shoot");});
$("press").addEventListener("pointerdown",e=>{e.preventDefault();socket.emit("action","press");});
</script>
</body>
</html>
