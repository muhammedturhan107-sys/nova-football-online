<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071b16">
<title>NOVA FOOTBALL ONLINE V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#071b16;color:white;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
#menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 20%,#205a3c,#071b16 70%)}
.panel{width:min(410px,100%);padding:27px;border:1px solid #47795a;border-radius:25px;background:#0b241b;box-shadow:0 20px 70px #0009;text-align:center}
.logo{font-size:32px;font-weight:1000;color:#66f2a0;letter-spacing:1px}
.sub{font-size:11px;letter-spacing:3px;color:#a3c9b2;margin:9px 0 25px}
input{width:100%;padding:15px;margin:7px 0;border:1px solid #315e46;border-radius:12px;background:#06170f;color:white;font-size:16px;outline:none}
button{border:0;border-radius:13px;padding:14px;background:#51e58c;color:#052012;font-weight:900;font-size:15px;cursor:pointer}
.menuBtn{width:100%;margin-top:10px}
.secondary{background:#1a3b2b;color:white;border:1px solid #416c50}
#status{min-height:22px;color:#b6d7c1;font-size:13px;margin-top:15px}
#hud{display:none;position:fixed;z-index:4;top:10px;left:50%;transform:translateX(-50%);min-width:205px;padding:10px 22px;border:1px solid #ffffff55;border-radius:17px;background:#06170eea;text-align:center;box-shadow:0 5px 25px #0007}
#score{font-size:30px;font-weight:1000;letter-spacing:5px}
#clock{font-size:11px;color:#9eeeb8;letter-spacing:2px}
#roomTag{position:fixed;z-index:4;top:12px;left:10px;padding:10px 12px;border-radius:10px;background:#06170edb;font-size:11px}
#message{position:fixed;z-index:6;top:27%;left:0;right:0;text-align:center;font-size:25px;font-weight:1000;text-shadow:0 3px 12px #000;pointer-events:none}
#controls{display:none;position:fixed;z-index:5;bottom:18px;left:0;right:0;align-items:end;justify-content:space-between;padding:0 22px;pointer-events:none}
#joy{width:125px;height:125px;border:2px solid #ffffff77;border-radius:50%;background:#ffffff24;position:relative;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:52px;height:52px;left:34px;top:34px;border-radius:50%;background:#ffffffc9;box-shadow:0 3px 12px #0006;pointer-events:none}
.actions{display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:auto}
#kick,#press{width:86px;height:86px;border-radius:50%;border:4px solid #ffffff77;font-size:13px;box-shadow:0 5px 18px #0007;touch-action:none}
#kick{background:#48ed8b;color:#052012}
#press{background:#ffb13b;color:#291600}
#press[hidden],#kick[hidden]{display:none}
#hint{font-size:10px;color:#fff;background:#07170ebd;border-radius:10px;padding:7px 10px}
@media(max-height:500px){
 #controls{bottom:8px}
 #joy{width:95px;height:95px}
 #stick{width:42px;height:42px;left:25px;top:25px}
 #kick,#press{width:68px;height:68px;font-size:11px}
 #hud{top:5px;padding:6px 16px}
 #score{font-size:23px}
}
</style>
</head>
<body>
<div id="game"></div>

<div id="menu">
 <div class="panel">
  <div class="logo">⚽ NOVA FOOTBALL</div>
  <div class="sub">ONLINE MULTIPLAYER · V2</div>
  <input id="name" maxlength="16" placeholder="Oyuncu adın">
  <button class="menuBtn" id="create">＋ ODA OLUŞTUR</button>
  <input id="code" maxlength="6" inputmode="numeric" placeholder="6 haneli oda kodu">
  <button class="menuBtn secondary" id="join">ODA KODUYLA KATIL</button>
  <div id="status">Sunucuya bağlanılıyor...</div>
 </div>
</div>

<div id="hud">
 <div id="score">0 - 0</div>
 <div id="clock">RAKİP BEKLENİYOR</div>
</div>
<div id="roomTag"></div>
<div id="message"></div>

<div id="controls">
 <div>
  <div id="joy"><div id="stick"></div></div>
 </div>
 <div class="actions">
  <div id="hint">TOP SENDEYKEN ŞUT</div>
  <button id="press" hidden>PRES</button>
  <button id="kick" hidden>ŞUT ⚽</button>
 </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

const $ = id => document.getElementById(id);
const socket = io();

let myId = null;
let team = 0;
let active = false;
let hasBall = false;
let joy = {x:0,z:0};
let kick = false;
let press = false;
let scene, camera, renderer, ball;
let players = {};
let targets = {};
let lastMessage = 0;

function status(t){ $("status").textContent=t; }

socket.on("connect",()=>status("Bağlantı kuruldu. Oda oluşturabilirsin."));
socket.on("connect_error",()=>status("Sunucu bağlantısı kurulamadı."));

$("create").onclick=()=>{
 socket.emit("createRoom",$("name").value||"Oyuncu");
};
$("join").onclick=()=>{
 socket.emit("joinRoom",{
  name:$("name").value||"Oyuncu",
  code:$("code").value.trim()
 });
};

socket.on("errorMessage",status);

socket.on("joined",d=>{
 myId=d.id;
 team=d.team;
 $("menu").style.display="none";
 $("hud").style.display="block";
 $("controls").style.display="flex";
 $("roomTag").textContent="ODA: "+d.code+" · "+(team===0?"MAVİ TAKIM":"KIRMIZI TAKIM");
 init3D();
 showMessage("RAKİP BEKLENİYOR");
});

socket.on("matchStarted",()=>{
 active=true;
 showMessage("MAÇ BAŞLADI!");
});

socket.on("state",s=>{
 $("score").textContent=s.score[0]+" - "+s.score[1];
 $("clock").textContent="SÜRESİZ MAÇ  ·  "+(s.started?"OYUN DEVAM EDİYOR":"RAKİP BEKLENİYOR");
 active=s.started;
 hasBall=s.owner===myId;

 $("kick").hidden=!hasBall;
 $("press").hidden=!(s.owner && s.owner!==myId);
 $("hint").textContent=hasBall?"TOP SENDE · ŞUT!":(s.owner?"RAKİPTE · PRES YAP":"TOPU KAP!");

 targets={};
 for(const p of s.players) targets[p.id]=p;

 if(ball && s.ball) ball.userData.target.set(s.ball.x,.45,s.ball.z);
});

socket.on("goal",d=>{
 $("score").textContent=d.score[0]+" - "+d.score[1];
 showMessage(d.team===team?"GOOOOL! ⚽":"RAKİP GOL ATTI!");
});

socket.on("notice",showMessage);

socket.on("opponentLeft",()=>{
 active=false;
 showMessage("RAKİP AYRILDI");
 $("clock").textContent="RAKİP BEKLENİYOR";
});

function showMessage(t){
 $("message").textContent=t;
 clearTimeout(lastMessage);
 lastMessage=setTimeout(()=>{$("message").textContent="";},1800);
}

function init3D(){
 if(renderer) return;

 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x87c7e9);
 scene.fog=new THREE.Fog(0x87c7e9,38,85);

 camera=new THREE.PerspectiveCamera(63,innerWidth/innerHeight,.1,120);
 camera.position.set(0,13,20);

 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 $("game").appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xffffff,0x315b35,2));

 const sun=new THREE.DirectionalLight(0xffffff,2.2);
 sun.position.set(-8,20,10);
 sun.castShadow=true;
 sun.shadow.mapSize.set(1024,1024);
 scene.add(sun);

 const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(34,24),
  new THREE.MeshStandardMaterial({color:0x218b42,roughness:1})
 );
 ground.rotation.x=-Math.PI/2;
 ground.receiveShadow=true;
 scene.add(ground);

 for(let i=0;i<8;i++){
  const stripe=new THREE.Mesh(
   new THREE.PlaneGeometry(4.25,24),
   new THREE.MeshStandardMaterial({color:i%2?0x238c43:0x2a9a4c})
  );
  stripe.rotation.x=-Math.PI/2;
  stripe.position.set(-14.875+i*4.25,.012,0);
  scene.add(stripe);
 }

 function line(x,z,w,h){
  const m=new THREE.Mesh(
   new THREE.BoxGeometry(w,.035,h),
   new THREE.MeshBasicMaterial({color:0xffffff})
  );
  m.position.set(x,.035,z);
  scene.add(m);
 }

 line(0,-11,34,.12);
 line(0,11,34,.12);
 line(-17,0,.12,22);
 line(17,0,.12,22);
 line(0,0,.1,22);
 line(-11,0,.12,13);
 line(-14,-6.5,6,.12);
 line(-14,6.5,6,.12);
 line(11,0,.12,13);
 line(14,-6.5,6,.12);
 line(14,6.5,6,.12);

 const circle=new THREE.Mesh(
  new THREE.RingGeometry(2.9,3,.06,96),
  new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide})
 );
 circle.rotation.x=-Math.PI/2;
 circle.position.y=.04;
 scene.add(circle);

 function goal(x){
  const g=new THREE.Group();
  for(const z of [-3,3]){
   const post=new THREE.Mesh(
    new THREE.BoxGeometry(.18,2.5,.18),
    new THREE.MeshStandardMaterial({color:0xffffff})
   );
   post.position.set(x,1.25,z);
   g.add(post);
  }
  const bar=new THREE.Mesh(
   new THREE.BoxGeometry(.18,.18,6),
   new THREE.MeshStandardMaterial({color:0xffffff})
  );
  bar.position.set(x,2.5,0);
  g.add(bar);
  scene.add(g);
 }
 goal(-17);
 goal(17);

 const standMat=new THREE.MeshStandardMaterial({color:0x263b50,roughness:.9});
 const seatColors=[0x2878bd,0xe8e8e8,0x2878bd,0xe8e8e8];

 for(const side of [-1,1]){
  const stand=new THREE.Mesh(new THREE.BoxGeometry(36,3,4),standMat);
  stand.position.set(0,1.2,side*15);
  scene.add(stand);

  for(let row=0;row<4;row++){
   for(let i=0;i<18;i++){
    const seat=new THREE.Mesh(
     new THREE.BoxGeometry(1.45,.45,.65),
     new THREE.MeshStandardMaterial({color:seatColors[(i+row)%4]})
    );
    seat.position.set(-16+i*1.88,2.1+row*.48,side*(13.7+row*.85));
    scene.add(seat);
   }
  }
 }

 for(const side of [-1,1]){
  const stand=new THREE.Mesh(new THREE.BoxGeometry(4,3,25),standMat);
  stand.position.set(side*19,1.2,0);
  scene.add(stand);
 }

 // Futbol topu
 ball=new THREE.Mesh(
  new THREE.SphereGeometry(.45,24,18),
  new THREE.MeshStandardMaterial({color:0xffffff,roughness:.55})
 );
 ball.castShadow=true;
 ball.userData.target=new THREE.Vector3(0,.45,0);
 scene.add(ball);

 window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
 });

 animate();
}

function makePlayer(p){
 const group=new THREE.Group();
 const color=p.team===0?0x2689ff:0xff4545;

 const shirt=new THREE.Mesh(
  new THREE.CapsuleGeometry(.55,.85,5,12),
  new THREE.MeshStandardMaterial({color,roughness:.7})
 );
 shirt.position.y=1.3;
 shirt.castShadow=true;
 group.add(shirt);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.32,16,12),
  new THREE.MeshStandardMaterial({color:0xf0bd91})
 );
 head.position.y=2.25;
 group.add(head);

 const legMat=new THREE.MeshStandardMaterial({color:0x172333});
 for(const z of [-.25,.25]){
  const leg=new THREE.Mesh(new THREE.BoxGeometry(.22,.75,.24),legMat);
  leg.position.set(0,.45,z);
  group.add(leg);
 }

 scene.add(group);
 players[p.id]=group;
}

function animate(){
 requestAnimationFrame(animate);
 if(!renderer)return;

 for(const [id,p] of Object.entries(targets)){
  if(!players[id])makePlayer(p);
  const obj=players[id];
  obj.position.x+=(p.x-obj.position.x)*.3;
  obj.position.z+=(p.z-obj.position.z)*.3;
  obj.rotation.y=p.yaw;
 }

 if(ball){
  ball.position.lerp(ball.userData.target,.35);
  ball.rotation.x+=.035;
  ball.rotation.z+=.025;
 }

 const me=targets[myId];
 if(me){
  const desired=new THREE.Vector3(me.x,11,me.z+(team===0?13:-13));
  camera.position.lerp(desired,.07);
  camera.lookAt(me.x,0,me.z);
 }

 renderer.render(scene,camera);
}

// Sunucuya düzenli hareket ve tuş bilgisi gönder
setInterval(()=>{
 if(!myId)return;
 socket.emit("input",{
  x:joy.x,
  z:joy.z,
  kick,
  press
 });
 kick=false;
},50);

// Mobil joystick
const joyEl=$("joy");
const stick=$("stick");
let pointer=null;

function moveJoy(e){
 const r=joyEl.getBoundingClientRect();
 const cx=r.left+r.width/2;
 const cy=r.top+r.height/2;
 let dx=e.clientX-cx;
 let dy=e.clientY-cy;
 const len=Math.hypot(dx,dy);
 const max=r.width*.34;

 if(len>max){
  dx=dx/len*max;
  dy=dy/len*max;
 }

 joy.x=dx/max;
 joy.z=dy/max;
 stick.style.transform=`translate(${dx}px,${dy}px)`;
}

joyEl.addEventListener("pointerdown",e=>{
 pointer=e.pointerId;
 joyEl.setPointerCapture(pointer);
 moveJoy(e);
});

joyEl.addEventListener("pointermove",e=>{
 if(pointer===e.pointerId)moveJoy(e);
});

function release(e){
 if(pointer!==e.pointerId)return;
 pointer=null;
 joy.x=0;
 joy.z=0;
 stick.style.transform="";
}

joyEl.addEventListener("pointerup",release);
joyEl.addEventListener("pointercancel",release);

// Şut sadece top sahibiyken gönderilir.
$("kick").addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(hasBall)kick=true;
});

// Pres yalnızca rakipte top varken etkin.
$("press").addEventListener("pointerdown",e=>{
 e.preventDefault();
 press=true;
});
$("press").addEventListener("pointerup",()=>press=false);
$("press").addEventListener("pointercancel",()=>press=false);
$("press").addEventListener("pointerleave",()=>press=false);

// Klavye kontrolleri
const keys={};
window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.code==="Space"&&hasBall)kick=true;
 if(e.key==="Shift")press=true;
 updateKeyboard();
});
window.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
 if(e.key==="Shift")press=false;
 updateKeyboard();
});

function updateKeyboard(){
 joy.x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
 joy.z=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
}

window.addEventListener("blur",()=>{
 joy={x:0,z:0};
 press=false;
});
</script>
</body>
</html>
