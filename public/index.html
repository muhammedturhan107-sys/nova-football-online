#novaV8Panel{padding:12px;margin:12px auto;background:#101b2b;color:white;border:1px solid #eab308;border-radius:12px}

<script src="/socket.io/socket.io.js">
/* NOVA V8 FINAL */
let novaV8Sprint=false;
const panel=document.createElement('div');
panel.id='novaV8Panel';
panel.innerHTML='<b>⚡ NOVA 165 FPS AKTİVASYONU</b><input id="novaV8Code" inputmode="numeric" placeholder="Aktivasyon kodu"><button id="novaV8Activate">AKTİF ET</button><p id="novaV8Info">Kod: 165</p>';

 }

 if(!root)return;

 b.className='novaV8Btn';

 root.appendChild(b);
}
novaV8Button('PAS','pass');

sprintButton.className='novaV8Btn';
sprintButton.textContent='DEPAR';
sprintButton.onclick=()=>{
 novaV8Sprint=!novaV8Sprint;
 sprintButton.textContent=novaV8Sprint?'DEPAR AÇIK':'DEPAR';

if(actionRoot)actionRoot.appendChild(sprintButton);

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const $=id=>document.getElementById(id);
const socket=io();

let scene,camera,renderer,ball,players=[],clock;
let started=false,finished=false,roomJoined=false;
let move={x:0,z:0},lastFrame=0,frames=0,fpsTime=performance.now();
let quality='balanced',adaptiveScale=1;
let playerId=0,roomCode='';
const profiles={
 lite:{scale:.72,fps:30,shadows:false,crowd:100,detail:0},
 balanced:{scale:.95,fps:40,shadows:false,crowd:240,detail:1},
 high:{scale:1.15,fps:60,shadows:true,crowd:450,detail:2},
 ultra:{scale:1.4,fps:60,shadows:true,crowd:700,detail:3}
};

function say(t){$('status').textContent=t}

function autoQuality(){
 const ram=navigator.deviceMemory||2;
 const cores=navigator.hardwareConcurrency||4;
 const screenPixels=innerWidth*innerHeight;
 if(ram<=2||cores<=4)return 'lite';
 if(ram<=4||screenPixels<900000)return 'balanced';
 if(ram>=8&&cores>=8)return 'ultra';
 return 'high';
}

function applyQuality(){
 const selected=$('quality').value;
 quality=selected==='auto'?autoQuality():selected;
 const p=profiles[quality];
 if(renderer){
  const boost=localStorage.getItem('nova165Mode')==='1';
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,boost?Math.min(p.scale,.85):p.scale)*adaptiveScale);
  renderer.shadowMap.enabled=p.shadows;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  if(scene){
   const sun=scene.getObjectByName('mainSun');
   if(sun){
    sun.castShadow=p.shadows;
    sun.shadow.mapSize.set(quality==='ultra'?2048:1024,quality==='ultra'?2048:1024);
   }
  }
 }
 $('qinfo').textContent=quality.toUpperCase()+' · '+p.fps+' FPS hedefi';
 localStorage.setItem('novaV71Quality',selected);
}

$('quality').value=localStorage.getItem('novaV71Quality')||'auto';
$('settingsBtn').onclick=()=>$('settings').style.display=$('settings').style.display==='block'?'none':'block';
$('closeSettings').onclick=()=>$('settings').style.display='none';
$('quality').onchange=()=>{applyQuality();say('Grafik ayarı değiştirildi. Sayfayı yenilemeden uygulanır.');};

function material(color,roughness=1,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}
function addBox(w,h,d,color,x,y,z,mat=null){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat||material(color));
 m.position.set(x,y,z);
 scene.add(m);
 return m;
}
function addLine(points,color=0xffffff,radius=.025){
 const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
 const mesh=new THREE.Mesh(
  new THREE.TubeGeometry(curve,Math.max(12,points.length*4),radius,5,false),
  new THREE.MeshBasicMaterial({color})
 );
 scene.add(mesh);
 return mesh;
}

function makeGrass(){
 const geo=new THREE.PlaneGeometry(40,20,1,1);
 const grass=new THREE.ShaderMaterial({
  uniforms:{
   time:{value:0},
   dark:{value:new THREE.Color(0x176a31)},
   light:{value:new THREE.Color(0x32984a)}
  },
  vertexShader:`
   varying vec2 vUv;
   void main(){
    vUv=uv;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
   }
  `,
  fragmentShader:`
   varying vec2 vUv;
   uniform vec3 dark;
   uniform vec3 light;
   void main(){
    float stripe=mod(floor(vUv.x*10.0),2.0);
    float grain=fract(sin(dot(vUv*1200.0,vec2(12.9898,78.233)))*43758.5453);
    vec3 c=mix(dark,light,stripe*.55+.18);
    c*=.96+grain*.055;
    gl_FragColor=vec4(c,1.0);
   }
  `
 });
 const mesh=new THREE.Mesh(geo,grass);
 mesh.rotation.x=-Math.PI/2;
 mesh.position.y=-.13;
 scene.add(mesh);
}

function makeField(){
 addBox(100,.2,75,0x164329,0,-.35,0);
 makeGrass();

 const white=new THREE.MeshBasicMaterial({color:0xf1f5e9});
 function fieldLine(w,d,x,z){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),white);
  m.rotation.x=-Math.PI/2;
  m.position.set(x,-.115,z);
  scene.add(m);
 }
 fieldLine(40,.055,0,-10);
 fieldLine(40,.055,0,10);
 fieldLine(.055,20,-20,0);
 fieldLine(.055,20,20,0);
 fieldLine(.055,20,0,0);

 const circle=new THREE.Mesh(
  new THREE.RingGeometry(3.05,3.11,64),
  new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide})
 );
 circle.rotation.x=-Math.PI/2;
 circle.position.y=-.105;
 scene.add(circle);

 const dot=new THREE.Mesh(new THREE.CircleGeometry(.12,16),white);
 dot.rotation.x=-Math.PI/2;
 dot.position.y=-.1;
 scene.add(dot);

 // Ceza sahaları
 for(const side of [-1,1]){
  fieldLine(6,.055,side*17,0);
  fieldLine(.055,12,side*17,0);
  fieldLine(6,.055,side*20,0);
  fieldLine(.055,12,side*20,0);
 }
}

function makeGoal(x,dir){
 const white=material(0xf5f5f5,.5);
 const frame=[
  [x,0,-3.6],[x,2.5,-3.6],
  [x,2.5,3.6],[x,0,3.6]
 ];
 addLine(frame,0xffffff,.095);
 const netMat=new THREE.LineBasicMaterial({color:0xdce7dc,transparent:true,opacity:.55});
 const positions=[];
 const back=x+dir*1.5;
 for(let z=-3.5;z<=3.51;z+=.5){
  positions.push(x,0,z,back,0,z);
  positions.push(x,2.45,z,back,2.45,z);
 }
 for(let y=0;y<=2.46;y+=.5){
  positions.push(x,y,-3.5,x,y,3.5);
  positions.push(back,y,-3.5,back,y,3.5);
 }
 const geo=new THREE.BufferGeometry();
 geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
 scene.add(new THREE.LineSegments(geo,netMat));
}

function makeStadium(){
 const detail=profiles[quality].detail;
 const seatColors=[0x263f54,0x344f67,0x455c70,0x263b50];

 // Tribünler: az sayıda büyük geometrili katman
 for(const z of [-1,1]){
  for(let row=0;row<5;row++){
   const y=2+row*1.35;
   const depth=2.4;
   const stand=addBox(45,1.15,depth,seatColors[row%4],0,y,z*(13+row*.65));
   stand.rotation.x=z*.035;
  }
  addBox(47,.35,3,0x1c2936,0,9.2,z*17);
  addBox(47,.22,1.2,0x8babbc,0,9.45,z*17);
 }

 // Yan tribünler
 for(const x of [-1,1]){
  for(let row=0;row<4;row++){
   const stand=addBox(2.4,1.15,25,seatColors[row%4],x*(22+row*.65),2+row*1.25,0);
   stand.rotation.z=-x*.035;
  }
 }

 // Çatı kolonları ve çatı kirişleri
 for(const z of [-1,1]){
  for(let x=-20;x<=20;x+=10){
   addBox(.25,8,.25,0x9aabb5,x,7,z*19);
  }
  addBox(46,.45,3.2,0x344b5b,0,11,z*19);
  addBox(46,.12,.5,0x9fb7c1,0,11.3,z*19);
 }

 // Aydınlatma kuleleri
 for(const x of [-1,1]){
  for(const z of [-1,1]){
   const px=x*22,pz=z*18;
   addBox(.25,7,.25,0x566875,px,7,pz);
   addBox(2,.25,.6,0xeaf5ff,px,10.5,pz);
   const glow=new THREE.PointLight(0xd9efff,detail>=2?35:0,30,2);
   glow.position.set(px,10,pz);
   scene.add(glow);
  }
 }

 // Kalabalık: tek InstancedMesh
 const count=profiles[quality].crowd;
 const crowdGeo=new THREE.CapsuleGeometry(.075,.13,2,4);
 const crowdMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1});
 const crowd=new THREE.InstancedMesh(crowdGeo,crowdMat,count);
 const dummy=new THREE.Object3D();
 const palette=[0xd5e5ec,0xf0d7b8,0x91c9b2,0xe1a5a5,0x9caddb,0xe6df9c];
 const colors=new THREE.Color();
 for(let i=0;i<count;i++){
  const side=i%4;
  const a=(Math.random()-.5)*40;
  const y=2+Math.random()*5;
  let x,z;
  if(side===0){x=a;z=14+Math.random()*3;}
  else if(side===1){x=a;z=-14-Math.random()*3;}
  else if(side===2){x=21+Math.random()*3;z=(Math.random()-.5)*25;}
  else{x=-21-Math.random()*3;z=(Math.random()-.5)*25;}
  dummy.position.set(x,y,z);
  dummy.rotation.y=Math.random()*6.28;
  dummy.scale.setScalar(.65+Math.random()*.6);
  dummy.updateMatrix();
  crowd.setMatrixAt(i,dummy.matrix);
  colors.setHex(palette[Math.floor(Math.random()*palette.length)]);
  crowd.setColorAt(i,colors);
 }
 scene.add(crowd);

 // Reklam panoları
 for(const z of [-11.5,11.5]){
  addBox(40,.7,.12,0x122d3a,0,.45,z);
  addBox(39,.035,.14,0x67f7a1,0,.85,z);
 }
}

function makePlayer(color){
 const group=new THREE.Group();
 const jersey=material(color,.75);
 const shorts=material(0x17232d);
 const skin=material(0xe6b58e);
 const socks=material(0xeceee9);
 const boots=material(0x171c20,.55);

 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.57,5,9),jersey);
 body.position.y=1.08;body.castShadow=true;group.add(body);

 const head=new THREE.Mesh(new THREE.SphereGeometry(.23,14,12),skin);
 head.position.y=1.95;head.castShadow=true;group.add(head);

 const hair=new THREE.Mesh(new THREE.SphereGeometry(.235,12,8,0,Math.PI*2,0,Math.PI*.48),material(0x28211d));
 hair.position.y=2.04;group.add(hair);

 const short=new THREE.Mesh(new THREE.BoxGeometry(.58,.32,.42),shorts);
 short.position.y=.66;group.add(short);

 for(const side of [-1,1]){
  const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.105,.43,4,7),jersey);
  arm.position.set(side*.42,1.12,0);
  arm.rotation.z=-side*.17;
  group.add(arm);

  const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.115,.48,4,7),skin);
  leg.position.set(side*.16,.28,0);
  group.add(leg);

  const sock=new THREE.Mesh(new THREE.CylinderGeometry(.11,.12,.3,8),socks);
  sock.position.set(side*.16,.25,0);
  group.add(sock);

  const boot=new THREE.Mesh(new THREE.BoxGeometry(.18,.11,.32),boots);
  boot.position.set(side*.16,.055,.07);
  group.add(boot);
 }
 // Forma numarası
 const number=new THREE.Mesh(
  new THREE.PlaneGeometry(.2,.24),
  new THREE.MeshBasicMaterial({color:0xffffff})
 );
 number.position.set(0,1.2,-.346);
 group.add(number);

 scene.add(group);
 return group;
}

function makeBall(){
 const g=new THREE.Group();
 const base=new THREE.Mesh(
  new THREE.SphereGeometry(.32,24,18),
  material(0xf6f6f0,.45)
 );
 g.add(base);

 // Siyah desen panelleri
 for(let i=0;i<5;i++){
  const patch=new THREE.Mesh(
   new THREE.CircleGeometry(.085,5),
   new THREE.MeshBasicMaterial({color:0x17191a,side:THREE.DoubleSide})
  );
  const a=i*2.4;
  patch.position.set(Math.sin(a)*.29,Math.cos(a)*.18,Math.cos(a)*.2);
  patch.lookAt(patch.position.clone().multiplyScalar(2));
  g.add(patch);
 }
 scene.add(g);
 return g;
}

function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x9bbdce);
 scene.fog=new THREE.Fog(0x9bbdce,65,120);

 camera=new THREE.PerspectiveCamera(53,innerWidth/innerHeight,.1,160);
 camera.position.set(0,24,28);
 camera.lookAt(0,0,0);

 renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:'high-performance',
  alpha:false
 });
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.12;
 renderer.shadowMap.enabled=false;
 $('game').appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xdceeff,0x284d34,2.1));

 const sun=new THREE.DirectionalLight(0xfff5df,2.1);
 sun.name='mainSun';
 sun.position.set(-18,35,15);
 sun.castShadow=true;
 sun.shadow.camera.left=-30;
 sun.shadow.camera.right=30;
 sun.shadow.camera.top=30;
 sun.shadow.camera.bottom=-30;
 sun.shadow.bias=-.00025;
 scene.add(sun);

 makeField();
 makeStadium();
 makeGoal(-20,-1);
 makeGoal(20,1);

 players=[
  makePlayer(0x168aff),
  makePlayer(0xe63f43)
 ];
 ball=makeBall();
 ball.position.y=.35;

 clock=new THREE.Clock();
 applyQuality();
 resize();
}

function resize(){
 if(!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight,false);
}

function formatTime(v){
 const t=Math.max(0,Math.ceil(v));
 return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
}

let novaV8Score=null;
function novaV8Celebrate(){
 const list=['GÜÇ POZU!','SAKİN KUTLAMA!','GENÇ YILDIZ!'];
 let el=document.getElementById('novaV8Goal');
 if(!el){
  el=document.createElement('div');
  el.id='novaV8Goal';
  el.style.cssText='position:fixed;z-index:99999;top:35%;left:50%;transform:translateX(-50%);padding:20px;background:#101b2b;color:#ffdc55;border:2px solid #ffdc55;border-radius:16px;font-size:28px;font-weight:900;pointer-events:none';
  document.body.appendChild(el);
 }
 el.textContent='⚽ '+list[Math.floor(Math.random()*list.length)];
 el.style.display='block';
 clearTimeout(window.novaV8GoalTimer);
 window.novaV8GoalTimer=setTimeout(()=>el.style.display='none',2200);
}
function update(data){
 if(!data)return;
 const score=JSON.stringify(data.score||[]);
 if(novaV8Score!==null&&score!==novaV8Score)novaV8Celebrate();
 novaV8Score=score;
 $('score').textContent=(data.score?.[0]||0)+' - '+(data.score?.[1]||0);
 $('timer').textContent=formatTime(data.remaining??180);

 (data.players||[]).forEach((p,i)=>{
  if(!players[i])return;
  players[i].position.set(p.x||0,0,p.z||0);
  players[i].rotation.y=p.team===0?Math.PI/2:-Math.PI/2;
 });

 if(data.ball){
  ball.position.set(data.ball.x||0,.35,data.ball.z||0);
  if(data.ball.owner)ball.rotation.x+=.03;
 }

 started=!!data.started;
 finished=!!data.finished;

 if(started){
  $('menu').style.display='none';
  $('result').style.display='none';
  $('controls').style.display='block';
  $('top').style.display='flex';
  $('exitBtn').style.display='block';
 }else{
  $('controls').style.display='none';
  if(finished){
   $('menu').style.display='none';
   $('result').style.display='block';
   $('top').style.display='flex';
   $('exitBtn').style.display='none';
   $('finalScore').textContent=(data.score?.[0]||0)+' - '+(data.score?.[1]||0);
   $('winner').textContent=data.winner||'Maç tamamlandı.';
  }else{
   $('top').style.display='none';
   $('result').style.display='none';
   if(roomJoined)$('menu').style.display='block';
  }
 }
}

function animate(now){
 requestAnimationFrame(animate);
 if(!renderer)return;
 const target=localStorage.getItem('nova165Mode')==='1'?165:profiles[quality].fps;
 if(now-lastFrame<1000/target)return;
 lastFrame=now;

 const dt=Math.min(.05,clock.getDelta());
 if(started){
  const p=players[playerId]||players[0];
  camera.position.x+=(p.position.x-camera.position.x)*Math.min(1,dt*1.8);
  camera.position.z+=(p.position.z+25-camera.position.z)*Math.min(1,dt*1.8);
  camera.lookAt(p.position.x,0,p.position.z);
 }
 renderer.render(scene,camera);
 frames++;

 if(now-fpsTime>=1000){
  const f=Math.round(frames*1000/(now-fpsTime));
  $('fps').textContent=f;
  frames=0;
  fpsTime=now;

  if($('quality').value==='auto'){
   if(f<24&&adaptiveScale>.65){
    adaptiveScale=Math.max(.65,adaptiveScale-.1);
    applyQuality();
   }else if(f>52&&adaptiveScale<1){
    adaptiveScale=Math.min(1,adaptiveScale+.05);
    applyQuality();
   }
  }
 }
}

try{
 init();
 requestAnimationFrame(animate);
}catch(e){
 say('Grafik başlatma hatası: '+e.message);
}

window.addEventListener('resize',resize);

function landscape(){
 document.documentElement.requestFullscreen?.().catch(()=>{});
 screen.orientation?.lock?.('landscape').catch(()=>{});
}

function showRoom(info){
 roomJoined=true;
 roomCode=info?.code||info?.roomCode||'';
 playerId=Math.max(0,(info?.player||1)-1);
 $('roomInfo').textContent=roomCode?'ODA KODUN: '+roomCode:'Odaya katıldın.';
 $('ready').style.display='block';
 $('ready').disabled=false;
 $('menu').style.display='block';
 $('result').style.display='none';
 say('Oda hazır. Arkadaşını bekle veya maça hazırlan.');
}

socket.on('connect',()=>{
 $('connection').textContent='Bağlı';
 say('Sunucu bağlantısı başarılı.');
});
socket.on('disconnect',()=>{
 $('connection').textContent='Bağlantı kesildi';
 say('Sunucu bağlantısı kesildi.');
});
socket.on('joined',showRoom);
socket.on('roomJoined',showRoom);
socket.on('state',update);
socket.on('notice',say);
socket.on('errorMessage',m=>{
 $('quick').disabled=false;
 $('ready').disabled=false;
 say(m);
});
socket.on('matchFound',()=>say('Rakip bulundu! İkiniz de hazır olun.'));

$('create').onclick=()=>{
 landscape();
 say('Oda oluşturuluyor...');
 socket.emit('createRoom');
};
$('join').onclick=()=>{
 landscape();
 const c=$('roomCode').value.trim();
 if(!/^\d{6}$/.test(c))return say('6 haneli oda kodu gir.');
 say('Odaya katılınıyor...');
 socket.emit('joinRoom',c);
};
$('quick').onclick=()=>{
 landscape();
 $('quick').disabled=true;
 say('Rakip aranıyor...');
 socket.emit('quickPlay');
};
$('ready').onclick=()=>{
 socket.emit('ready');
 $('ready').disabled=true;
 say('Hazır durumundasın. Rakip bekleniyor...');
};
$('rematch').onclick=()=>{
 $('rematch').disabled=true;
 socket.emit('rematch');
 say('Rövanş isteği gönderildi.');
};
$('back').onclick=()=>{
 socket.emit('leaveRoom');
 roomJoined=false;
 finished=false;
 started=false;
 $('result').style.display='none';
 $('menu').style.display='block';
 $('top').style.display='none';
 $('roomInfo').textContent='';
 $('ready').style.display='none';
 $('ready').disabled=false;
 $('rematch').disabled=false;
 say('Ana menü.');
};
$('shoot').onclick=()=>{if(started)socket.emit('action','shoot')};
$('press').onclick=()=>{if(started)socket.emit('action','press')};
$('exitBtn').onclick=()=>{
 socket.emit('leaveRoom');
 roomJoined=false;
 started=false;
 finished=false;
 $('controls').style.display='none';
 $('top').style.display='none';
 $('exitBtn').style.display='none';
 $('menu').style.display='block';
 $('result').style.display='none';
 $('ready').style.display='none';
 say('Odadan ayrıldın.');
};

const base=$('stickBase'),knob=$('stick');
let pointer=null;
function moveStick(e){
 const r=base.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 const n=Math.hypot(x,y),max=38;
 if(n>max){x=x/n*max;y=y/n*max;}
 knob.style.transform=`translate(${x}px,${y}px)`;
 move={x:x/max,z:y/max};
}
function reset(){
 pointer=null;
 move={x:0,z:0};
 knob.style.transform='translate(0,0)';
}
base.addEventListener('pointerdown',e=>{
 pointer=e.pointerId;
 base.setPointerCapture(pointer);
 moveStick(e);
});
base.addEventListener('pointermove',e=>{
 if(pointer===e.pointerId)moveStick(e);
});
base.addEventListener('pointerup',reset);
base.addEventListener('pointercancel',reset);
base.addEventListener('lostpointercapture',reset);

setInterval(()=>{
 if(started)socket.emit('input',{...move,sprint:novaV8Sprint});
},50);

$('rotate').style.display=innerHeight>innerWidth?'flex':'none';
window.addEventListener('resize',()=>{
 $('rotate').style.display=innerHeight>innerWidth?'flex':'none';
});
</script>
